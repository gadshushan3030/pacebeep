# Compile the iOS app on every PR, so a Swift change that doesn't build is caught before merge.
# Simulator build, no signing, no secrets: Config.xcconfig's `#include? "Local.xcconfig"` is
# optional, so a fresh checkout builds as-is. Not a required check (yet), hence the paths filter.
name: ios

on:
  push:
    branches: [main]
    paths: [ios/**, .github/workflows/ios.yml]
  pull_request:
    paths: [ios/**, .github/workflows/ios.yml]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - name: Build (iOS Simulator, unsigned)
        working-directory: ios
        run: >-
          xcodebuild build -quiet
          -project PaceBeep.xcodeproj -scheme PaceBeep
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO

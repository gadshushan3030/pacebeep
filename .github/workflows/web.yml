# Lint, type-check, migrate and test web/ against a real Postgres on every push and PR.
# `npm test --if-present` is a no-op until a branch adds the test script (PR #20), so this
# workflow can land first. Only `main` deploys (web/vercel.json); this is the check before it.
name: web

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", ".github/workflows/web.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pacebeep
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pacebeep
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      # PageProps/LayoutProps are generated into .next/types; a fresh checkout has none.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run db:migrate
      - run: npm test --if-present

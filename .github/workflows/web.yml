# Lint, type-check, migrate and test web/ against a real Postgres on every push and PR.
# Only `main` deploys (web/vercel.json); this is the check before it. `main` requires the
# `check` job to pass, so it runs on every PR with no paths filter: a required check that
# never reports (an iOS-only PR) would block the merge forever. It takes under a minute.
name: web

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pacebeep
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pacebeep
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      # PageProps/LayoutProps are generated into .next/types; a fresh checkout has none.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run db:migrate
      - run: npm test --if-present

/><path d="M250 239 V249" class="line"/><text x="250" y="266" text-anchor="middle" class="xs">token issued</text><path d="M502 239 V249" class="line"/><text x="502" y="266" text-anchor="middle" class="xs">you click Disconnect</text><path d="M772 239 V249" class="line"/><text x="772" y="266" text-anchor="middle" class="xs">JWT expires (1 h)</text><text x="32" y="314" class="h">WHAT DISCONNECT DELETES · ONE TRANSACTION · ONLY YOUR ROWS</text><rect x="32" y="330" width="212" height="140" rx="12" class="f-gray" stroke-width="1.5"/><g transform="translate(44 342)" class="k-gray" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v13c0 1.7 3.6 3 8 3s8-1.3 8-3v-13M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g><text x="74" y="359" class="mono c-gray" style="font-size:13px;font-weight:700">oauthClient</text><text x="46" y="387" class="xs">the assistant's registration</text><rect x="44" y="400" width="188" height="26" rx="7" class="panel" stroke-width="1"/><text x="56" y="417.5" class="s" style="font-size:12px">ChatGPT</text><rect x="184.48" y="403.5" width="41.52" height="20.5" rx="10.25" class="f-green" stroke-width="1"/><text x="205.23999999999998" y="417.53" text-anchor="middle" class="c-green" style="font-size:10.5px;font-weight:600">kept</text><rect x="44" y="432" width="188" height="26" rx="7" class="panel" stroke-width="1"/><text x="56" y="449.5" class="s" style="font-size:12px">shared by all its users</text><rect x="260" y="330" width="212" height="140" rx="12" class="f-orange" stroke-width="1.5"/><g transform="translate(272 342)" class="k-orange" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v13c0 1.7 3.6 3 8 3s8-1.3 8-3v-13M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g><text x="302" y="359" class="mono c-orange" style="font-size:13px;font-weight:700">oauthConsent</text><text x="274" y="387" class="xs">your approval</text><rect x="272" y="400" width="188" height="26" rx="7" class="f-red" stroke-width="1"/><text x="284" y="417.5" class="c-red" style="font-size:12px;text-decoration:line-through">you</text><rect x="394.84" y="403.5" width="59.160000000000004" height="20.5" rx="10.25" class="f-red" stroke-width="1"/><text x="424.41999999999996" y="417.53" text-anchor="middle" class="c-red" style="font-size:10.5px;font-weight:600">deleted</text><rect x="272" y="432" width="188" height="26" rx="7" class="panel" stroke-width="1"/><text x="284" y="449.5" class="s" style="font-size:12px">other user</text><rect x="412.48" y="435.5" width="41.52" height="20.5" rx="10.25" class="f-green" stroke-width="1"/><text x="433.24" y="449.53" text-anchor="middle" class="c-green" style="font-size:10.5px;font-weight:600">kept</text><rect x="488" y="330" width="212" height="140" rx="12" class="f-orange" stroke-width="1.5"/><g transform="translate(500 342)" class="k-orange" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v13c0 1.7 3.6 3 8 3s8-1.3 8-3v-13M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g><text x="530" y="359" class="mono c-orange" style="font-size:13px;font-weight:700">oauthRefreshToken</text><text x="502" y="387" class="xs">long-lived, mints new JWTs</text><rect x="500" y="400" width="188" height="26" rx="7" class="f-red" stroke-width="1"/><text x="512" y="417.5" class="c-red" style="font-size:12px;text-decoration:line-through">you</text><rect x="622.84" y="403.5" width="59.160000000000004" height="20.5" rx="10.25" class="f-red" stroke-width="1"/><text x="652.4200000000001" y="417.53" text-anchor="middle" class="c-red" style="font-size:10.5px;font-weight:600">deleted</text><rect x="500" y="432" width="188" height="26" rx="7" class="panel" stroke-width="1"/><text x="512" y="449.5" class="s" style="font-size:12px">other user</text><rect x="640.48" y="435.5" width="41.52" height="20.5" rx="10.25" class="f-green" stroke-width="1"/><text x="661.24" y="449.53" text-anchor="middle" class="c-green" style="font-size:10.5px;font-weight:600">kept</text><rect x="716" y="330" width="212" height="140" rx="12" class="f-orange" stroke-width="1.5"/><g transform="translate(728 342)" class="k-orange" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"><ellipse cx="12" cy="5.5" rx="8" ry="3"/><path d="M4 5.5v13c0 1.7 3.6 3 8 3s8-1.3 8-3v-13M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g><text x="758" y="359" class="mono c-orange" style="font-size:13px;font-weight:700">oauthAccessToken</text><text x="730" y="387" class="xs">issued tokens</text><rect x="728" y="400" width="188" height="26" rx="7" class="f-red" stroke-width="1"/><text x="740" y="417.5" class="c-red" style="font-size:12px;text-decoration:line-through">you</text><rect x="850.84" y="403.5" width="59.160000000000004" height="20.5" rx="10.25" class="f-red" stroke-width="1"/><text x="880.4200000000001" y="417.53" text-anchor="middle" class="c-red" style="font-size:10.5px;font-weight:600">deleted</text><rect x="728" y="432" width="188" height="26" rx="7" class="panel" stroke-width="1"/><text x="740" y="449.5" class="s" style="font-size:12px">other user</text><rect x="868.48" y="435.5" width="41.52" height="20.5" rx="10.25" class="f-green" stroke-width="1"/><text x="889.24" y="449.53" text-anchor="middle" class="c-green" style="font-size:10.5px;font-weight:600">kept</text><text x="32" y="500" class="" style="font-size:12.5px;font-weight:600">Why refresh tokens too: <tspan class="mute">with only the consent gone they would still mint JWTs, and pass again the moment you reconnect the same assistant.</tspan></text></svg>

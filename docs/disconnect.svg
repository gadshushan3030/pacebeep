<svg xmlns="http://www.w3.org/2000/svg" width="960" height="528" viewBox="0 0 960 528" role="img" aria-labelledby="t d"><title id="t">Why Disconnect works immediately</title><desc id="d">Two timelines. With a JWT check only, a disconnected assistant keeps working until the token expires and can refresh forever. With the live consent check, the next call gets 401. Disconnect deletes this user's oauthConsent, oauthRefreshToken and oauthAccessToken rows in one transaction and keeps the shared oauthClient.</desc><style>

<x-dc>
<helmet>

</style>

<main style="width: 390px; height: 844px; box-sizing: border-box; padding: 64px 20px 28px; display: flex; flex-direction: column; gap: 22px; background: #F5F4F0; color: #121316; font-family: 'Archivo', 'Helvetica Neue', system-ui, sans-serif; overflow: hidden">

  </div>

  <section aria-label="Summary" style="padding: 18px; background: #FFFFFF; border: 1px solid #E3E1DB; border-radius: 22px; display: flex; flex-direction: column; gap: 14px">
    <span style="font-size: 20px; font-weight: 700; font-stretch: 82%">6 × 2:00 / 1:00</span>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 30px; font-weight: 800; font-stretch: 70%; font-variant-numeric: tabular-nums">27:03</span>
        <span style="font-size: 13px; color: #5C5F66">time</span>

      <div style="display: flex; flex-direction: column; gap: 2px">

        <span style="font-size: 13px; color: #5C5F66">reps</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 30px; font-weight: 800; font-stretch: 70%; font-variant-numeric: tabular-nums">0</span>
        <span style="font-size: 13px; color: #5C5F66">missed beeps</span>
      </div>
    </div>
    <div aria-label="All intervals completed" style="display: flex; gap: 3px">
      <div style="flex-grow: 300; flex-basis: 0; height: 8px; border-radius: 3px; background: #8A8D94"></div>
      <div style="flex-grow: 120; flex-basis: 0; height: 8px; border-radius: 3px; background: #E4572E"></div>
      <div style="flex-grow: 60; flex-basis: 0; height: 8px; border-radius: 3px; background: #1D3C8F"></div>

      <div style="flex-grow: 120; flex-basis: 0; height: 8px; border-radius: 3px; background: #E4572E"></div>
      <div style="flex-grow: 60; flex-basis: 0; height: 8px; border-radius: 3px; background: #1D3C8F"></div>
      <div style="flex-grow: 120; flex-basis: 0; height: 8px; border-radius: 3px; background: #E4572E"></div>
      <div style="flex-grow: 60; flex-basis: 0; height: 8px; border-radius: 3px; background: #1D3C8F"></div>
      <div style="flex-grow: 120; flex-basis: 0; height: 8px; border-radius: 3px; background: #E4572E"></div>
      <div style="flex-grow: 60; flex-basis: 0; height: 8px; border-radius: 3px; background: #1D3C8F"></div>
      <div style="flex-grow: 120; flex-basis: 0; height: 8px; border-radius: 3px; background: #E4572E"></div>
      <div style="flex-grow: 300; flex-basis: 0; height: 8px; border-radius: 3px; background: #8A8D94"></div>
    </div>
  </section>

  <section aria-label="How hard was it?" style="display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <h2 style="margin: 0; font-size: 24px; font-weight: 800; font-stretch: 80%">How hard was it?</h2>
      <span style="font-size: 13px; color: #5C5F66">1 easy · 10 all out</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">
      <button type="button" style="min-height: 56px; border-radius: 16px; border: 1px solid #D6D3CB; background: #FFFFFF; font: inherit; font-size: 22px; font-weight: 800; font-stretch: 75%; color: #121316; cursor: pointer">1</button>
      <button type="button" style="min-height: 56px; border-radius: 16px; border: 1px solid #D6D3CB; background: #FFFFFF; font: inherit; font-size: 22px; font-weight: 800; font-stretch: 75%; color: #121316; cursor: pointer">2</button>
      <button type="button" style="min-height: 56px; border-radius: 16px; border: 1px solid #D6D3CB; background: #FFFFFF; font: inherit; font-size: 22px; font-weight: 800; font-stretch: 75%; color: #121316; cursor: pointer">3</button>
      <button type="button" style="min-height: 56px; border-radius: 16px; border: 1px solid #D6D3CB; background: #FFFFFF; font: inherit; font-size: 22px; font-weight: 800; font-stretch: 75%; color: #121316; cursor: pointer">4</button>
      <button type="button" style="min-height: 56px; border-radius: 16px; border: 1px solid #D6D3CB; background: #FFFFFF; font: inherit; font-size: 22px; font-weight: 800; font-stretch: 75%; color: #121316; cursor: pointer">5</button>
      <button type="button" style="min-height: 56px; border-radius: 16px; border: 1px solid #D6D3CB; background: #FFFFFF; font: inherit; font-size: 22px; font-weight: 800; font-stretch: 75%; color: #121316; cursor: pointer">6</button>
      <button type="button" aria-pressed="true" style="min-height: 56px; border-radius: 16px; border: 1px solid #121316; background: #121316; font: inherit; font-size: 22px; font-weight: 800; font-stretch: 75%; color: #F5F4F0; cursor: pointer">7</button>
      <button type="button" style="min-height: 56px; border-radius: 16px; border: 1px solid #D6D3CB; background: #FFFFFF; font: inherit; font-size: 22px; font-weight: 800; font-stretch: 75%; color: #121316; cursor: pointer">8</button>
      <button type="button" style="min-height: 56px; border-radius: 16px; border: 1px solid #D6D3CB; background: #FFFFFF; font: inherit; font-size: 22px; font-weight: 800; font-stretch: 75%; color: #121316; cursor: pointer">9</button>
      <button type="button" style="min-height: 56px; border-radius: 16px; border: 1px solid #D6D3CB; background: #FFFFFF; font: inherit; font-size: 22px; font-weight: 800; font-stretch: 75%; color: #121316; cursor: pointer">10</button>
    </div>
  </section>

  <div role="status" style="display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; color: #1B6E43">
    <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="#1B6E43" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    Sent to your coach, with RPE 7
  </div>

  <a href="Main.dc.html" style="margin-top: auto; min-height: 56px; border-radius: 16px; background: #121316; color: #F5F4F0; font-size: 18px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">Done</a>
